name: Monatliches Datenupdate

on:
  schedule:
    # am 6. und 20. jedes Monats, 05:17 UTC (nicht zur vollen Stunde, dann verzögert GitHub geplante Läufe oft)
    - cron: "17 5 6,20 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04   # feste Version: neue Images haben anfangs oft kein vorgebautes Python
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Daten laden
        run: PYTHONPATH=src python -u -m saa.fetch
        timeout-minutes: 25

      - name: Modell rechnen und Seite bauen
        run: |
          PYTHONPATH=src python -m saa.build
          python web/render.py

      - name: Änderungen übernehmen
        run: |
          git config user.name "Philip Kroos"
          git config user.email "Philip-Kroos@users.noreply.github.com"
          git add data/raw docs
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Datenupdate $(date -u +%Y-%m)"
            git push
          fi
