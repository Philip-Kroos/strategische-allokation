name: Monatliches Datenupdate

on:
  schedule:
    - cron: "0 6 3 * *"     # am 3. jedes Monats, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Daten laden
        run: PYTHONPATH=src python -u -m saa.fetch
        timeout-minutes: 25

      - name: Modell rechnen und Seite bauen
        run: |
          PYTHONPATH=src python -m saa.build
          python web/render.py

      - name: Änderungen übernehmen
        run: |
          git config user.name "Philip Kroos"
          git config user.email "Philip-Kroos@users.noreply.github.com"
          git add data/raw docs
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Datenupdate $(date -u +%Y-%m)"
            git push
          fi
